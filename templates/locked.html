{% extends "base.html" %}
{% set back_href = '/libraries' %}
{% block title %}{{ library.title }} | TEMP-U{% endblock %}
{% block main %}
<div class="mx-auto w-full max-w-2xl px-4 py-16 text-center sm:px-6">
  <div class="mx-auto flex size-14 items-center justify-center rounded-full bg-muted">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
  </div>
  <h1 class="mt-4 text-2xl font-semibold tracking-tight">{{ library.title }}</h1>
  <p class="mt-2 text-muted-foreground">This library is locked for your account.</p>
</div>
{% endblock %}
