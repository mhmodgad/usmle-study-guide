{% extends "base.html" %}
{% block title %}Settings | TEMP-U{% endblock %}
{% block main %}
<div class="mx-auto w-full max-w-2xl px-4 py-8 sm:px-6 lg:px-8">
  <h1 class="text-2xl font-semibold tracking-tight">Settings</h1>
  <form id="settings-form" class="mt-6 space-y-5">
    <label class="block">
      <span class="text-sm font-medium">Display name</span>
      <input name="displayName" value="{{ current.get('displayName','') }}" class="mt-1 h-10 w-full rounded-lg border bg-background px-3 text-sm">
    </label>
    <label class="block">
      <span class="text-sm font-medium">Daily study goal (TEMPU units)</span>
      <input name="dailyStudyGoalUnits" type="number" min="2" max="32" value="{{ current.get('dailyStudyGoalUnits','8') }}" class="mt-1 h-10 w-full rounded-lg border bg-background px-3 text-sm">
    </label>
    <label class="block">
      <span class="text-sm font-medium">Reader text size (px)</span>
      <input name="readerTextSize" type="number" min="14" max="18" value="{{ current.get('readerTextSize','15') }}" class="mt-1 h-10 w-full rounded-lg border bg-background px-3 text-sm">
    </label>
    <label class="block">
      <span class="text-sm font-medium">Theme</span>
      <select name="theme" class="mt-1 h-10 w-full rounded-lg border bg-background px-3 text-sm">
        <option value="dark" {{ 'selected' if current.get('theme')=='dark' }}>Dark</option>
        <option value="light" {{ 'selected' if current.get('theme')=='light' }}>Light</option>
      </select>
    </label>
    <label class="flex items-center gap-2">
      <input type="checkbox" name="showVideoReferences" {{ 'checked' if current.get('showVideoReferences')=='true' }}>
      <span class="text-sm font-medium">Show video references</span>
    </label>
    <button type="submit" class="rounded-lg bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">Save</button>
    <span id="settings-saved" class="ml-3 text-sm text-muted-foreground"></span>
  </form>
</div>
{% endblock %}
{% block scripts %}<script>
document.getElementById('settings-form').addEventListener('submit', async e=>{
  e.preventDefault();
  const f=e.target, body={};
  body.displayName=f.displayName.value;
  body.dailyStudyGoalUnits=f.dailyStudyGoalUnits.value;
  body.readerTextSize=f.readerTextSize.value;
  body.theme=f.theme.value;
  body.showVideoReferences=f.showVideoReferences.checked?'true':'false';
  body.initials=(body.displayName.trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('')||'ST').toUpperCase();
  await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  localStorage.setItem('tempu-theme', body.theme);
  document.getElementById('settings-saved').textContent='Saved';
  setTimeout(()=>location.reload(),400);
});
</script>{% endblock %}
